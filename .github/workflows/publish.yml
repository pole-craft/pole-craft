name: Publish

# A pushed version tag (v0.0.1) publishes to PyPI. A manual run publishes the
# chosen branch to TestPyPI, as a trial before the real upload.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Check that the tag matches the package version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version="$(ls dist/*.tar.gz | sed -E 's/.*-([^-]+)\.tar\.gz/\1/')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
      - name: Install Gmsh system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa libxcursor1 libxft2 libxinerama1 libxrender1 libgomp1
      # Test the built wheel, not the source tree, from an unpacked copy of the
      # source distribution so that its tests and designs are checked too.
      - name: Test the built package
        shell: bash
        run: |
          python -m venv /tmp/venv
          wheel="$(ls dist/*.whl)"
          /tmp/venv/bin/python -m pip install "${wheel}[dev,mesh]"
          mkdir /tmp/sdist
          tar -xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          rm -rf /tmp/sdist/polecraft
          cd /tmp/sdist
          /tmp/venv/bin/python -m pytest
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    name: Upload to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/polecraft/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A repeated trial of the same version is not an error.
          skip-existing: true

  pypi:
    name: Upload to PyPI
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/polecraft/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
