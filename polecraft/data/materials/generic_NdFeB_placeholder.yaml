# PLACEHOLDER. THIS IS NOT A DATASHEET VALUE.
#
# The remanence and recoil permeability are the stand-in numbers that
# `polecraft solve` has used so far, and the temperature coefficient is a
# round number in the range usually quoted for sintered NdFeB. None of them
# describes any grade or maker. Real grades are added from supplier
# datasheets.
#
# Numbers are at 20 C. The coefficient is a fraction per kelvin about 20 C:
# -0.0012 means the remanence falls 0.12 % for each kelvin of rise. The
# recoil permeability is taken as constant with temperature, so the
# coercivity on the recoil line, Hcb = Br / (mu_r mu0), follows the remanence
# and has no coefficient of its own.
#
# A datasheet also gives the intrinsic coercivity Hcj and its coefficient,
# which is several times larger than the remanence's. An entry made from a
# datasheet may carry them as `intrinsic_coercivity_A_per_m` and
# `intrinsic_coercivity_temp_coefficient_per_K`, and the knee of the
# demagnetisation curve as `knee_to_intrinsic_coercivity_ratio` (Hk / Hcj,
# the squareness). They are used by the check against demagnetisation, not
# in the field solution. This placeholder gives none of them, because it has
# no datasheet to take them from.
name: generic_NdFeB_placeholder
kind: magnet
description: Placeholder sintered NdFeB magnet. Not a datasheet value.
source: none; stand-in numbers, not from any datasheet
remanence_T: 1.2
relative_permeability: 1.05
remanence_temp_coefficient_per_K: -0.0012
