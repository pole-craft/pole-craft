# PLACEHOLDER. THIS IS NOT REAL STEEL DATA.
#
# These numbers do not come from any steel maker, datasheet or measurement,
# and they do not describe M270-35A or any other grade. Every row is worked
# out from one formula (a Frohlich law):
#
#     B = mu0 * H + Js * H / (a + H),   Js = 2.0 T,   a = 300 A/m
#
# The curve has the general shape of a non-oriented electrical steel, which
# is enough to exercise the solver. Do not use it to design a motor, and do
# not compare results made with it against measurements or against results
# made with real steel data. Two programs given this same table can be
# checked against each other, which is how the solver is compared with FEMM.
# Measured curves for real grades will be added to this folder with their
# source.
name: generic_35A_placeholder
kind: steel
description: Placeholder curve from a formula. Not real steel data.
formula: B = mu0 * H + 2.0 * H / (300 + H)
# Rows are [B in tesla, H in A/m].
