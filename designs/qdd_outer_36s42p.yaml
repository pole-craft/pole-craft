# Reference design: 36-slot, 42-pole outer-rotor surface-magnet motor,
# about 90 mm outer diameter.
#
# The dimensions are placeholders typical of a motor of this class, not a
# measured or optimised design. Lengths are in millimetres.

format_version: 1
type: qdd_outer
slots: 36
poles: 42

# Cross-section, from the outside in. Every radius follows from the outer
# diameter and the thicknesses below; the bore comes out at 52 mm diameter.
geometry:
  air_gap_mm: 0.6
  rotor:
    outer_diameter_mm: 90
    yoke_thickness_mm: 2.5        # back iron behind the magnets
  magnet:
    thickness_mm: 2.5
    arc_fraction: 0.85            # magnet angle / pole angle
    magnetisation: parallel       # parallel | radial
  stator:
    tooth_width_mm: 3.0           # parallel-sided teeth
    slot_opening_mm: 1.5
    tooth_tip_height_mm: 0.6
    tooth_tip_taper_mm: 0.6
    slot_depth_mm: 9.0
    yoke_thickness_mm: 3.2

# Lengthwise data. The 2D solve uses it only in correction formulas.
axial:
  stack_length_mm: 12
  magnet_overhang_mm: 0           # per end
  skew_deg: 0
  end_winding_overhang_mm: null   # per end; null = estimate from the slot geometry

magnet:
  material: N42SH
  temperature_C: 80

winding:
  wire_diameter_mm: 0.5           # bare copper
  turns_per_coil: 20
  parallel_strands: 1
  conductor: copper
  connection: star                # star | delta
  temperature_C: 100

steel:
  stator: M270-35A
  rotor: M270-35A
  stacking_factor: 0.95
