# 12-slot, 10-pole outer-rotor surface-magnet motor, 50 mm outer diameter.
#
# The dimensions are placeholders typical of a small motor of this class, not
# a measured or optimised design. Lengths are in millimetres.

format_version: 1
type: qdd_outer
slots: 12
poles: 10

# Cross-section, from the outside in. The bore comes out at 19.2 mm diameter.
geometry:
  air_gap_mm: 0.5
  rotor:
    outer_diameter_mm: 50
    yoke_thickness_mm: 3.5        # back iron behind the magnets
  magnet:
    thickness_mm: 2.0
    arc_fraction: 0.85            # magnet angle / pole angle
    magnetisation: parallel       # parallel | radial
  stator:
    tooth_width_mm: 5.0           # parallel-sided teeth
    slot_opening_mm: 2.0
    tooth_tip_height_mm: 0.6
    tooth_tip_taper_mm: 0.8
    slot_depth_mm: 5.0
    yoke_thickness_mm: 3.0

# Lengthwise data. The 2D solve uses it only in correction formulas.
axial:
  stack_length_mm: 10
  magnet_overhang_mm: 0           # per end
  skew_deg: 0
  end_winding_overhang_mm: null   # per end; null = estimate from the slot geometry

magnet:
  material: N42SH
  temperature_C: 80

winding:
  wire_diameter_mm: 0.4           # bare copper
  insulated_diameter_mm: null     # over the enamel, from the wire datasheet; null = unknown
  turns_per_coil: 20
  parallel_strands: 1
  conductor: copper
  connection: star                # star | delta
  temperature_C: 100

steel:
  stator: M270-35A
  rotor: M270-35A
  stacking_factor: 0.95
